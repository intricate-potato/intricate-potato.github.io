- title: Ongoing Research Projects
  type: time_table
  contents:
    - title: Covert Dialect Bias in LLMs and Contextual Integrity Violation
      institution: "Master's Thesis - Supervisor: Dr. Rita Orji, Persuasive Computing Lab, Dalhousie University"
      description:
        - Measuring covert dialect prejudice in LLMs across housing-related social judgments
        - Employing a computational matched-guise methodology from psychology
        - Characterizing dialect-based attribute inference as a contextual integrity concern
        - "Phase 1 results accepted at AIES 2026; Phase 2 works on contextual integrity"
    - title: Narrative-Aware News Recommendation Systems
      institution: "Collaborator: Dr. Ga Wu (Dalhousie University; ex-Senior ML Engineer, Twitter)"
      description:
        - "Designing a content-based recommender that operationalizes Greimas' Actantial Model as role-stratified actant embeddings within a bipartite Graph Attention Network, enabling narrative-grounded explainability over the MIND benchmark"
        - Investigating user-level impacts on trust, perception, and transparency
    - title: Sociotechnical Security and Privacy in VANETs
      institution: "Collaborators: Fairuz Shaiara (U. Manitoba), Sherajul Arifin (IUT Bangladesh), Faisal Haque Bappy, Dr. Tariqul Islam (UMBC), Dr. Raiful Hasan (Kent State)"
      description:
        - Collaborating on blockchain-based trust management and privacy-preserving authentication schemes for vehicular ad-hoc networks

